name: Scheduled ETL
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC weekdays, after the US close
  workflow_dispatch:
jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m etl.etl --config config.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: output/
          retention-days: 30
